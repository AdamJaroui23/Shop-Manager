<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>My Shop</title>
</head>
<body class="bg-white text-gray-900">
  <header class="flex justify-between p-6">
    <a href="#" class="font-bold">My Shop</a>
  </header>

  <main class="mx-auto max-w-3xl px-6 py-16 text-center">
    <h1 class="text-4xl font-bold">Good things, simply made.</h1>
    <p class="mt-3 text-gray-600">Everyday essentials for your home.</p>
    <a href="#product" class="mt-6 inline-block rounded bg-black px-5 py-3 text-white">
      Shop now
    </a>

    <section id="product" class="mx-auto mt-16 max-w-xs text-left">
      <div class="aspect-square rounded bg-gray-100"></div>
      <h2 class="mt-4 font-semibold">Everyday Mug</h2>
      <p class="mt-1 text-gray-600">$24</p>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>

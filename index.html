<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse products from My Shop." />
  <title>My Shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header class="site-header">
    <a href="#top" class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      My Shop
    </a>

    <a class="header-link" href="#products">
      Shop <span aria-hidden="true">↓</span>
    </a>

    <button class="cart-btn" id="cart-toggle" type="button" aria-expanded="false" aria-controls="cart-sidebar">
      Cart
    </button>
  </header>

  <div class="cart-overlay" id="cart-overlay" aria-hidden="true"></div>

  <aside class="cart-sidebar" id="cart-sidebar" aria-hidden="true" aria-labelledby="cart-title">
    <div class="cart-header">
      <h2 id="cart-title">Your cart</h2>
      <button class="close-btn" id="cart-close" type="button" aria-label="Close cart">&times;</button>
    </div>
    <div class="cart-items">
      <p>Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <p>Items: <span id="cart-item-count">0</span></p>
      <p class="cart-total"><span>Total</span><span id="cart-total">$0.00</span></p>
    </div>
  </aside>

  <main id="top">

    <section class="catalog" id="products" aria-labelledby="catalog-title">

      <div class="page-intro">
        <h1>Find your next favorite</h1>
        <p>Browse our collection of everyday products.</p>
      </div>

      <div class="catalog-toolbar">

        <h2 id="catalog-title">Products</h2>
        
        <div class="filters">
          <label class="visually-hidden" for="category-filter">
            Filter by category
          </label>
          <select id="category-filter">
            <option value="all">All Categories</option>
          </select>

          <label class="visually-hidden" for="max-price">
            Maximum price
          </label>
          <input
            id="max-price"
            type="number"
            min="0"
            step="any"
            placeholder="Max price"
            inputmode="decimal"
          />

          <label class="stock-filter" for="in-stock-only">
            <input id="in-stock-only" type="checkbox" />
            In stock only
          </label>

          <button id="reset-filters" type="button">Reset filters</button>
        </div>

        <form class="search-form" role="search">
          <label class="visually-hidden" for="product-search">
            Search products
          </label>

          <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 4.5 4.5"></path>
          </svg>

          <input id="product-search" name="q" type="search" placeholder="Search products" autocomplete="off" />
        </form>

      </div>

      <p id="search-status" class="search-status"></p>

      <div id="products-container"></div>

    </section>
    

  </main>

  <script src="index.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Enter your customer information." />
  <title>Customer Information - My Shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="site-header">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      My Shop
    </a>
    <a class="header-link" href="index.html#products">Back to shop</a>
  </header>

  <main class="checkout-page">
    <section class="checkout-panel" aria-labelledby="checkout-title">
      <h1 id="checkout-title">Customer information</h1>
      <div class="customer-fields">
        <label>
          Name
          <input type="text" name="name" autocomplete="name" required />
        </label>
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <label>
          Phone
          <input type="tel" name="phone" autocomplete="tel" required />
        </label>
        <label>
          Address
          <input type="text" name="address" autocomplete="street-address" required />
        </label>
      </div>
    </section>
  </main>
</body>

</html>
